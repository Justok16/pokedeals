name: Scan PrestaShop
on:
  schedule:
    # Toutes les 30 minutes -- independant des deux autres cron (main.py
    # toutes les 15 min, scan_shopify.yml toutes les 30 min aussi). Les
    # trois tournent en parallele sur le meme repo ; cf. l'etape de
    # sauvegarde ci-dessous pour la gestion des collisions Git.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      boutiques:
        description: "Domaines a scanner, separes par des espaces (vide = les 16 boutiques par defaut)"
        required: false
        default: ""
permissions:
  contents: write   # necessaire pour sauvegarder data/stock_boutiques_tcg_prestashop.json
concurrency:
  group: scan_prestashop   # groupe DEDIE, distinct de "pokedeals" et "scan_shopify"
  cancel-in-progress: false  # les trois workflows tournent independamment les uns des autres
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # 6.8 min mesurees en local sur les 16 boutiques (avant retrait de
    # bcd-jeux.fr) -- marge large car 2 sitemaps sont volumineux
    # (skydreamer.fr ~31 Mo, ludum.fr ~17 Mo) et pourraient ralentir sur le
    # reseau du runner GitHub Actions. +10 min pour le radar precommandes
    # ajoute ensuite (relit les memes sitemaps volumineux, cf. etape dediee
    # plus bas) -- a resserrer/reajuster si la duree mesuree en prod le permet.
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le scan PrestaShop (16 boutiques par defaut)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel : active la verification photo (cf. verification_photo.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # optionnel : ajoute les cartes des watchlists SaaS (cf. watchlist_saas.py)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"   # sans ca, la sortie (progression boutique par boutique) reste bufferisee et n'apparait dans le log que si le job va au bout -- inutile pour diagnostiquer un timeout (cf. run du 15/08/2026, log vide malgre 30 min ecoulees)
        run: python scan_boutique_prestashop.py ${{ github.event.inputs.boutiques }}
      - name: Sauvegarder la mémoire de stock
        run: |
          git config user.name "pokedeals-bot"
          git config user.email "bot@pokedeals.local"
          # Meme logique de rattrapage que pokedeals.yml / scan_shopify.yml :
          # on met de cote notre fichier de memoire, on recupere la version
          # distante (qui peut avoir avance entre-temps -- deux autres cron
          # tournent en parallele sur le meme repo), puis on reimpose notre
          # version fraichement scannee.
          cp -f data/stock_boutiques_tcg_prestashop.json /tmp/stock_boutiques_tcg_prestashop.json 2>/dev/null || true
          git stash || true
          git pull --rebase || git rebase --abort || true
          git stash pop || true
          git stash drop || true   # si le pop a laisse un conflit (stash "garde en cas de besoin"), on le purge -- notre cp/add/commit juste apres reimpose de toute facon la version fraichement scannee ; un stash oublie ici polluerait l'etape "Sauvegarder" suivante DANS LE MEME JOB (cf. SESSION_NOTES.md, cascade du 15/08/2026)
          cp -f /tmp/stock_boutiques_tcg_prestashop.json data/stock_boutiques_tcg_prestashop.json 2>/dev/null || true
          git add data/stock_boutiques_tcg_prestashop.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "maj mémoire stock prestashop [skip ci]"
          # Push avec un rattrapage : si le push echoue (un autre cron a
          # pousse entre-temps), on refait un pull --rebase en preservant
          # notre memoire, puis on re-pousse. Si ca echoue ENCORE, on laisse
          # le workflow passer au rouge pour que ce soit visible (sinon la
          # memoire non sauvee = risque de rater/dupliquer une detection de
          # retour en stock au prochain cycle).
          git push || {
            echo "Push refusé, tentative de rattrapage..."
            cp -f data/stock_boutiques_tcg_prestashop.json /tmp/stock_boutiques_tcg_prestashop.json 2>/dev/null || true
            git pull --rebase || git rebase --abort || true
            cp -f /tmp/stock_boutiques_tcg_prestashop.json data/stock_boutiques_tcg_prestashop.json 2>/dev/null || true
            git add data/stock_boutiques_tcg_prestashop.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "maj mémoire stock prestashop [skip ci]"
            git push
          }
      - name: Lancer le radar précommandes (30e Anniversaire / ME06 Règne Delta)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scan_precommandes.py prestashop
      - name: Sauvegarder la mémoire du radar précommandes
        run: |
          git config user.name "pokedeals-bot"
          git config user.email "bot@pokedeals.local"
          cp -f data/precommandes_anniversaire_prestashop.json /tmp/precommandes_anniversaire_prestashop.json 2>/dev/null || true
          git stash || true
          git pull --rebase || git rebase --abort || true
          git stash pop || true
          git stash drop || true   # meme parade qu'a l'etape precedente -- purge un eventuel stash laisse par un pop en conflit
          cp -f /tmp/precommandes_anniversaire_prestashop.json data/precommandes_anniversaire_prestashop.json 2>/dev/null || true
          git add data/precommandes_anniversaire_prestashop.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "maj mémoire radar précommandes prestashop [skip ci]"
          git push || {
            echo "Push refusé, tentative de rattrapage..."
            cp -f data/precommandes_anniversaire_prestashop.json /tmp/precommandes_anniversaire_prestashop.json 2>/dev/null || true
            git pull --rebase || git rebase --abort || true
            cp -f /tmp/precommandes_anniversaire_prestashop.json data/precommandes_anniversaire_prestashop.json 2>/dev/null || true
            git add data/precommandes_anniversaire_prestashop.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "maj mémoire radar précommandes prestashop [skip ci]"
            git push
          }
