name: Scan précommandes philibertnet.com

on:
  schedule:
    # Alignee le 30/08/2026 sur la cadence des autres radars precommandes
    # (30 min) -- decision explicite de Justok, priorite a la reactivite
    # sur une precommande plutot qu'a la charge envoyee au site tiers.
    # Anciennement 2h (cf. historique git) par politesse envers ce site
    # tiers (~940 pages produit visitees a chaque cycle). Duree reelle
    # mesuree sur les 15 derniers cycles a 2h : ~8-10 min, tres en dessous
    # du timeout de 45 min ci-dessous -- aucun risque de chevauchement de
    # cycles a 30 min. A surveiller : si philibert.net se met a bloquer/
    # limiter les requetes (erreurs HTTP 429/403 en hausse), revenir a une
    # cadence plus large.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write   # necessaire pour sauvegarder data/precommandes_generique_philibert.json
concurrency:
  group: scan_precommandes_philibert
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # ~940 requetes a ~0.3-1s chacune (delai de politesse + latence reseau
    # reelle) : pas encore mesure en conditions reelles (premier lancement)
    # -- 45 min choisi par prudence large. A ajuster une fois une marge
    # reelle mesuree sur plusieurs cycles (cf. CLAUDE.md : ne jamais
    # resserrer/elargir un timeout a l'aveugle).
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le scan précommandes philibertnet.com
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # mémoire du scan (cf. memoire_supabase.py, migration 25/08/2026) -- DISTINCT de POKEPRECOMS_SUPABASE_URL ci-dessous
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POKEPRECOMS_SUPABASE_URL: ${{ secrets.POKEPRECOMS_SUPABASE_URL }}
          POKEPRECOMS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POKEPRECOMS_SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: python scan_precommandes_philibert.py
