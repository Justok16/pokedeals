name: Diag temporaire (jetable)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python _diag_philibert.py
