name: Veille express 30 ans (fiches connues)
on:
  # 08/10/2026 : ni le cron GitHub "*/5" ni workflow_run ne se declenchent
  # sur ce depot (seuls les workflow_dispatch tournent). La veille est lancee
  # par la derniere etape de scan_complement (~toutes les 20 min via
  # cron-job.org) et fait 4 passages espaces de 5 min (choix de Justok).
  workflow_dispatch: {}
permissions:
  contents: read   # memoire dans Supabase (cle veille_express_30e), aucune ecriture sur le repo
concurrency:
  group: veille_express   # jamais deux veilles en meme temps ; un declenchement en trop attend
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # 4 passages espaces de 5 min (~25 s chacun, mesure GitHub 08/10/2026 :
    # 123 fiches + 3 enseignes) : ~16 min ; le suivant attend (concurrence).
    timeout-minutes: 22
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
      VEILLE_PASSAGES: "4"
      VEILLE_INTERVALLE: "300"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Veille express des fiches connues
        run: python veille_express_30e.py
