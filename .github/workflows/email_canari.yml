name: Canari Email

# Cron DESACTIVE le 22/09/2026 a la demande de Justok : EMAIL_CANARI_DESTINATAIRE
# pointe vers un alias (+canari) de sa propre boite, donc chaque envoi de test
# (8/jour) lui arrivait directement -- pas de boite de rechange disponible pour
# l'instant. workflow_dispatch reste actif : le canari peut toujours etre lance
# a la main (bouton "Run workflow" dans l'onglet Actions) si besoin de verifier
# ponctuellement la livraison email. Pour reactiver la surveillance automatique :
# decommenter le bloc "schedule" ci-dessous (et idealement reconfigurer
# EMAIL_CANARI_DESTINATAIRE vers une boite que Justok ne consulte pas au quotidien).
on:
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: email_canari
  cancel-in-progress: false

jobs:
  canari:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier la livraison email réelle
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          # Adresse de test DISTINCTE du compte SendGrid/de Justok -- c'est
          # justement la vérification qui aurait détecté le bug Resend du
          # 04/09/2026 (livraison restreinte au seul propriétaire du compte).
          EMAIL_CANARI_DESTINATAIRE: ${{ secrets.EMAIL_CANARI_DESTINATAIRE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python verification_email_canari.py
