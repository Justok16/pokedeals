name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Audit du 18/08/2026 : seul workflow du repo sans permissions explicites --
# n'a besoin que de lire le code (checkout + pytest, aucun push/commentaire/
# artefact). Moindre privilège : pas d'ecriture par defaut sur GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  pytest:
    # 09/10/2026 : ubuntu-latest bascule sur Ubuntu 26 à partir du 19/10/2026.
    # Les tests tournent sur les deux versions d'avance, pour voir une casse
    # (Python 3.12 indisponible, dépendance cassée...) avant la bascule.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: scraper
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances (dev)
        run: pip install -r requirements-dev.txt
      - name: Lancer les tests
        run: python -m pytest tests/ -v
