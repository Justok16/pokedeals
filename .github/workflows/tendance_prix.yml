name: Tendance Prix

on:
  schedule:
    # Quotidien (08h30 UTC, apres la mise a jour du F&G/cotes du matin) --
    # un point de prix par jour suffit largement pour un indicateur de
    # tendance a l'echelle de semaines/mois, pas besoin de plus frequent.
    - cron: "30 8 * * *"
  workflow_dispatch: {}
permissions:
  contents: write   # necessaire pour sauvegarder data/historique_prix_tendance.json
concurrency:
  group: tendance_prix   # groupe DEDIE, distinct des 5 autres workflows
  cancel-in-progress: false
jobs:
  tendance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le suivi de tendance de prix
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python historique_prix.py
      - name: Sauvegarder l'historique de tendance
        run: |
          git config user.name "pokedeals-bot"
          git config user.email "bot@pokedeals.local"
          sauvegarder_puis_reimposer() {
            cp -f data/historique_prix_tendance.json /tmp/historique_prix_tendance.json 2>/dev/null || true
            git stash -u || true
            git pull --rebase || git rebase --abort || true
            git stash pop || true
            git stash drop || true   # purge defensive d'un stash laisse par un pop en conflit -- un seul appel de sauvegarde dans ce job (runner jete juste apres), donc sans le risque de cascade documente dans CLAUDE.md (scan_prestashop.yml/scan_shopify.yml), mais garde par coherence/prudence
            cp -f /tmp/historique_prix_tendance.json data/historique_prix_tendance.json 2>/dev/null || true
            git add data/historique_prix_tendance.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "maj historique tendance prix [skip ci]"
          }

          sauvegarder_puis_reimposer

          # Push avec plusieurs tentatives de rattrapage -- jusqu'a 3, avec
          # un delai croissant, pour couvrir aussi bien un vrai conflit
          # (autre push entre-temps) qu'une erreur transitoire cote GitHub
          # ("Internal Server Error", cf. le même correctif sur
          # pokedeals.yml le 02/09/2026 -- rejouer immédiatement retombe
          # souvent sur la même erreur encore chaude côté serveur).
          for tentative in 1 2 3; do
            if git push; then
              break
            fi
            if [ "$tentative" = 3 ]; then
              echo "Push toujours refusé après 3 tentatives, abandon."
              exit 1
            fi
            echo "Push refusé (tentative $tentative/3), nouvel essai dans $((tentative * 5))s..."
            sleep $((tentative * 5))
            sauvegarder_puis_reimposer
          done
