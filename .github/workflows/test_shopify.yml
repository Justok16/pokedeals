name: Test Shopify (manuel)
on:
  workflow_dispatch:
    inputs:
      boutiques:
        description: "Domaines a scanner, separes par des espaces"
        required: false
        default: "kyoriyu.fr questcorner.fr"
permissions:
  contents: write   # necessaire pour sauvegarder data/stock_boutiques_tcg.json
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le test Shopify (boutiques limitées)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scan_boutique.py ${{ github.event.inputs.boutiques }}
      - name: Sauvegarder la mémoire de stock (test)
        run: |
          git config user.name "pokedeals-bot"
          git config user.email "bot@pokedeals.local"
          git add data/stock_boutiques_tcg.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "test shopify : maj memoire stock [skip ci]"
          git push || echo "Push refuse (pas bloquant pour un test manuel)"
