name: Scan WooCommerce
on:
  schedule:
    # Toutes les 30 minutes -- independant des trois autres cron (main.py
    # 15 min, scan_shopify.yml et scan_prestashop.yml 30 min). Tous tournent
    # en parallele sur le meme repo ; cf. les etapes de sauvegarde ci-dessous
    # pour la gestion des collisions Git.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      boutiques:
        description: "Domaines a scanner (remplace les 2 lots par defaut, ignore le decoupage en 2 jobs)"
        required: false
        default: ""
permissions:
  contents: write   # necessaire pour sauvegarder data/stock_boutiques_tcg_woocommerce.json
concurrency:
  group: scan_woocommerce   # groupe DEDIE, distinct des 3 autres workflows
  cancel-in-progress: false
jobs:
  # 19.0 min mesurees en local sur les 26 boutiques d'un coup -- marge
  # insuffisante face au surcout habituel de GitHub Actions (vu +19 a +38%
  # sur les 2 autres plateformes, ce qui aurait pu depasser un timeout de
  # 20 min). Scinde en 2 lots EQUILIBRES PAR VOLUME D'URLs sitemap (pas par
  # nombre de boutiques -- cardshunter.fr/k-tcg.com/hamacards.com a eux
  # seuls pesent la moitie du volume total).
  #
  # Lot A et lot B tournent desormais en VRAI PARALLELE (28/08/2026, demande
  # de Justok -- grosse sortie Pokemon a venir, cycle complet trop long).
  # Jusque-la sequentiels ("needs: scan_lot_a") pour eviter une course
  # d'ecriture sur la meme cle memoire Supabase -- chaque lot ecrit
  # desormais sa PROPRE cle (SCAN_LOT_SUFFIXE, cf. scan_boutique_woocommerce.py),
  # donc plus aucune collision possible meme en parallele. Lot A et lot B
  # portent sur des boutiques DIFFERENTES : aucune boutique n'est scannee
  # plus souvent qu'avant, seul le temps d'attente entre les deux lots
  # disparait -- pas de risque anti-robot supplementaire.
  scan_lot_a:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # 18 -> 22 min le 11/08/2026 : diagnostic du run #12 annule (18m17s,
    # timeout depasse) -- marge normale mesuree de 13m27s a 16m15s sur 6
    # runs reussis (soit seulement 1m45s a 4m33s de marge sur 18 min),
    # deja tendue en fonctionnement normal (LOT_A concentre cardshunter.fr
    # et hamacards.com, 2 des 3 plus gros catalogues WooCommerce). Pas lie
    # au radar precommandes (jobs sequentiels, aucun chevauchement
    # possible, cf. SESSION_NOTES.md pour le diagnostic complet).
    # Marge reconfirmee le 17/08/2026 apres le fix mymesis.fr (deplacee
    # vers LOT_B, cf. boutiques_woocommerce.py) : 13m26s-13m36s sur les 2
    # premiers cycles de production suivant le fix, soit ~8 min/36% de
    # marge -- nettement plus sain qu'avant le fix. Plusieurs annulations
    # observees le 16-17/08 juste avant le fix (mymesis.fr encore en
    # LOT_A, bloquee 9+ min) ne sont PAS un signe de marge insuffisante du
    # timeout lui-meme : elles datent toutes d'avant le commit du fix.
    timeout-minutes: 22
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le scan WooCommerce (lot A)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel : active la verification photo (cf. verification_photo.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # optionnel : ajoute les cartes des watchlists SaaS (cf. watchlist_saas.py)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_LOT_SUFFIXE: "_lot_a"   # cle Supabase dediee -- evite une course avec lot B qui tourne en parallele
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"   # sans ca, la sortie reste bufferisee et n'apparait dans le log qu'en fin de job -- inutile pour diagnostiquer un timeout
          # Audit externe du 30/08/2026 : passer par env: + "$VAR" plutot que
          # d'injecter ${{ }} directement dans run: (injection shell possible).
          BOUTIQUES: ${{ github.event.inputs.boutiques }}
        run: |
          if [ -n "$BOUTIQUES" ]; then
            python scan_boutique_woocommerce.py $BOUTIQUES
          else
            python -c "from boutiques_woocommerce import LOT_A; print(' '.join(LOT_A))" > /tmp/lot_a.txt
            python scan_boutique_woocommerce.py $(cat /tmp/lot_a.txt)
          fi

  scan_lot_b:
    if: ${{ github.event.inputs.boutiques == '' || github.event.inputs.boutiques == null }}  # lot B saute si un scan cible manuel est demande
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    timeout-minutes: 18
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le scan WooCommerce (lot B)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel : active la verification photo (cf. verification_photo.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # optionnel : ajoute les cartes des watchlists SaaS (cf. watchlist_saas.py)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_LOT_SUFFIXE: "_lot_b"   # cle Supabase dediee -- evite une course avec lot A qui tourne en parallele
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # BOUTIQUES_WOOCOMMERCE_AUTO : boutiques ajoutees par decouverte_boutiques.py
          # (radar AFNIC) -- greffees au lot B, qui a le plus de marge de temps.
          python -c "from boutiques_woocommerce import LOT_B; from boutiques_decouvertes import BOUTIQUES_WOOCOMMERCE_AUTO; print(' '.join(LOT_B + BOUTIQUES_WOOCOMMERCE_AUTO))" > /tmp/lot_b.txt
          python scan_boutique_woocommerce.py $(cat /tmp/lot_b.txt)

  scan_precommandes:
    needs: [scan_lot_a, scan_lot_b]   # tourne apres les 2 lots du scan cartes (desormais paralleles entre eux), jamais en parallele d'eux -- evite qu'une boutique soit sollicitee par 2 jobs en meme temps
    if: ${{ github.event.inputs.boutiques == '' || github.event.inputs.boutiques == null }}  # saute si un scan cible manuel est demande
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # Meme volume de boutiques que le scan cartes (qui a besoin de 2 lots
    # sequentiels pour tenir dans 18 min chacun), mais le radar est moins
    # couteux par boutique (pas de matching sur 194 criteres -- juste un
    # prefiltre de slug puis quelques pages ciblees) : les 2 lots sont
    # traites l'un apres l'autre en 2 etapes du MEME job plutot qu'en 2 jobs
    # separes. A scinder en jobs distincts si la duree mesuree en prod
    # depasse la marge ci-dessous.
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le radar précommandes (30e Anniversaire / ME06 Règne Delta) — lot A
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # mémoire du radar (cf. memoire_supabase.py, migration 25/08/2026)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "from boutiques_woocommerce import LOT_A; print(' '.join(LOT_A))" > /tmp/lot_a.txt
          python scan_precommandes.py woocommerce $(cat /tmp/lot_a.txt)
      - name: Lancer le radar précommandes — lot B
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Audit du 18/08/2026 (cf. SESSION_NOTES.md) : ce step concatenait
          # auparavant "LOT_B + BOUTIQUES_WOOCOMMERCE_REPLI_API_REST", mais
          # mymesis.fr (seul membre de cette derniere liste) fait DEJA partie
          # de LOT_B depuis son deplacement le 16/08/2026 (cf.
          # boutiques_woocommerce.py) -- la concatenation le faisait donc
          # scanner DEUX FOIS dans ce meme step (pas de fausse alerte grace
          # a la dedup memoire d'alerte_precommande.py, mais un vrai gaspillage
          # de temps reseau sur une boutique deja connue pour etre lente). Le
          # mode "api_rest" reste correctement applique a mymesis.fr : `modes`
          # (scan_precommandes.py, _boutiques_et_replis) est calcule depuis
          # les listes completes, independamment de la liste de boutiques
          # passee en argument CLI ci-dessous.
          python -c "from boutiques_woocommerce import LOT_B; print(' '.join(LOT_B))" > /tmp/lot_b_precommandes.txt
          python scan_precommandes.py woocommerce $(cat /tmp/lot_b_precommandes.txt)
      - name: Lancer le radar précommandes — boutiques scellé uniquement
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "from boutiques_woocommerce import BOUTIQUES_WOOCOMMERCE_PRECOMMANDE_SEULEMENT; from boutiques_decouvertes import BOUTIQUES_WOOCOMMERCE_AUTO_PRECOMMANDE_SEULEMENT; print(' '.join(BOUTIQUES_WOOCOMMERCE_PRECOMMANDE_SEULEMENT + BOUTIQUES_WOOCOMMERCE_AUTO_PRECOMMANDE_SEULEMENT))" > /tmp/lot_precommande_seulement.txt
          python scan_precommandes.py woocommerce $(cat /tmp/lot_precommande_seulement.txt)
