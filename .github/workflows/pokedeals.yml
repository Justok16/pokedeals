name: PokéDeals
on:
  schedule:
    # Toutes les 15 minutes (GitHub peut décaler de quelques minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permet aussi de lancer à la main depuis l'onglet Actions
permissions:
  contents: write   # nécessaire pour sauvegarder data/*.json
concurrency:
  group: pokedeals
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Décalage aléatoire (anti-détection)
        run: sleep $((RANDOM % 30))
      - name: Lancer le scan
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel : active la verification photo (cf. verification_photo.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # optionnel : alimente les watchlists persos du SaaS (cf. connecteur_supabase.py)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}   # optionnel : notifications push des utilisateurs SaaS (cf. notifications_saas.py)
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}   # optionnel : notifications email des utilisateurs SaaS (cf. notifications_saas.py)
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"   # sans ca, la sortie reste bufferisee et n'apparait dans le log qu'en fin de job -- inutile pour diagnostiquer un timeout
        run: python main.py
      - name: Sauvegarder les caches restants (stats, prix Cardtrader/TCGdex/Cardmarket)
        run: |
          git config user.name "pokedeals-bot"
          git config user.email "bot@pokedeals.local"
          # Les fichiers de données du bot font autorité : on met de côté nos
          # changements, on récupère la version distante, puis on RÉIMPOSE nos
          # fichiers de données. Évite les conflits d'autostash rencontrés avant.
          #
          # IMPORTANT (audit externe du 17/08/2026, cf. SESSION_NOTES.md) :
          # on ne sauvegarde/reimpose QUE les fichiers que main.py possede
          # reellement (lui-meme + moteur_cote.py + connecteur_cardtrader.py +
          # connecteur_tcgdex.py, tous importes par main.py). Un "cp data/*.json"
          # englobait AUSSI les fichiers des 3 autres workflows (stock
          # boutiques, precommandes, decouverte, tendance) qui tournent en
          # parallele sur le meme repo -- si l'un d'eux poussait une mise a
          # jour PENDANT que ce job tournait, "git pull --rebase" la
          # recuperait correctement, mais le "cp /tmp/*.json data/" qui
          # suivait l'ecrasait aussitot par la version perimee d'avant le
          # pull, sans que rien ne le signale (pas une corruption de fichier
          # -- juste une mise a jour d'un AUTRE workflow silencieusement
          # annulee, avec un risque concret d'alerte de retour en stock
          # dupliquee au cycle suivant de ce workflow).
          FICHIERS_MAIN="stats.json cardtrader.json api_prix.json cardmarket_prix.json"

          sauvegarder_puis_reimposer() {
            for f in $FICHIERS_MAIN; do
              cp -f "data/$f" "/tmp/$f" 2>/dev/null || true
            done
            cp -f data/deals.csv /tmp/deals.csv 2>/dev/null || true
            git stash --include-untracked || true
            git pull --rebase || git rebase --abort || true
            git stash drop || true
            for f in $FICHIERS_MAIN; do
              cp -f "/tmp/$f" "data/$f" 2>/dev/null || true
            done
            cp -f /tmp/deals.csv data/deals.csv 2>/dev/null || true
            git add $(printf 'data/%s ' $FICHIERS_MAIN) data/deals.csv 2>/dev/null || true
            git diff --cached --quiet || git commit -m "maj mémoire [skip ci]"
          }

          sauvegarder_puis_reimposer

          # Push avec plusieurs tentatives de rattrapage. Deux causes de
          # refus bien distinctes : (1) un autre scan a poussé entre-temps
          # -- "pull --rebase" recupere alors une vraie mise a jour distante
          # ; (2) erreur cote GitHub purement transitoire ("Internal Server
          # Error", constatee en prod le 02/09/2026 -- deux echecs
          # consecutifs en l'espace de 2s, "pull --rebase" confirmant a
          # chaque fois "Already up to date", donc aucun vrai conflit). Le
          # cas (2) ne se resout pas en rejouant le push aussitot (le
          # serveur est souvent encore chaud) -- jusqu'a 3 tentatives avec
          # un delai croissant avant chaque nouvel essai. Si les 3 echouent,
          # on laisse le workflow passer au rouge pour que ce soit visible
          # (sinon la mémoire non sauvée = risque d'alertes en double).
          for tentative in 1 2 3; do
            if git push; then
              break
            fi
            if [ "$tentative" = 3 ]; then
              echo "Push toujours refusé après 3 tentatives, abandon."
              exit 1
            fi
            echo "Push refusé (tentative $tentative/3), nouvel essai dans $((tentative * 5))s..."
            sleep $((tentative * 5))
            sauvegarder_puis_reimposer
          done
