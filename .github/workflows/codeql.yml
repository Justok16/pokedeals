name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 4 * * 2"

# Ajouté le 02/09/2026 : analyse de sécurité automatique du code (recherche
# de failles connues -- injection, désérialisation dangereuse, etc.), en
# complément de Dependabot (qui ne couvre que les dépendances tierces, pas
# le code du repo lui-même). Gratuit sur ce repo car public.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyser
        uses: github/codeql-action/analyze@v4
