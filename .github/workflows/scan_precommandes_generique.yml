name: Scan précommandes génériques (PokéPrécoms)
on:
  schedule:
    # Toutes les 30 minutes, comme scan_shopify.yml -- mais WORKFLOW SEPARE
    # (budget de temps propre) plutot qu'une etape de plus dans ce dernier :
    # ce radar refait un passage COMPLET sur le catalogue de chaque boutique
    # Shopify (pas de reutilisation du catalogue deja recupere par
    # scan_boutique.py dans le meme cycle), ce qui aurait significativement
    # entame la marge deja tendue de scan_shopify.yml (cf. son commentaire
    # de timeout : ~20% de marge mesuree le 17/08/2026).
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      boutiques:
        description: "Domaines à scanner, séparés par des espaces (vide = toutes les boutiques Shopify actives)"
        required: false
        default: ""
permissions:
  contents: write   # necessaire pour sauvegarder data/precommandes_generiques_shopify.json
concurrency:
  group: scan_precommandes_generique
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # Pas encore de mesure reelle en prod (premier lancement) -- 25 min
    # choisi par prudence (legerement sous les 30 min de scan_shopify.yml,
    # qui scanne le meme nombre de boutiques Shopify pour un travail
    # comparable). A ajuster une fois une marge reelle mesuree sur
    # plusieurs cycles (cf. CLAUDE.md : ne jamais resserrer/elargir un
    # timeout a l'aveugle).
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le radar précommandes générique (Shopify)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # mémoire du radar (cf. memoire_supabase.py, migration 25/08/2026) -- DISTINCT de POKEPRECOMS_SUPABASE_URL ci-dessous
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POKEPRECOMS_SUPABASE_URL: ${{ secrets.POKEPRECOMS_SUPABASE_URL }}
          POKEPRECOMS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POKEPRECOMS_SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: python scan_precommandes_generique.py ${{ github.event.inputs.boutiques }}
