name: Scan précommandes génériques (PokéPrécoms)
on:
  schedule:
    # Resserre a 15 min le 28/08/2026 (demande de Justok, grosse sortie
    # Pokemon a venir -- ce radar est justement celui qui detecte les
    # NOUVELLES precommandes, le plus pertinent pour ne pas rater une
    # sortie) : mesure reelle sur plusieurs jours, cycle complet stable a
    # 11.7-12.6 min, largement sous les 15 min (marge >15%). Workflow
    # SEPARE de scan_shopify.yml (budget de temps propre) plutot qu'une
    # etape de plus dans ce dernier : ce radar refait un passage COMPLET
    # sur le catalogue de chaque boutique Shopify (pas de reutilisation du
    # catalogue deja recupere par scan_boutique.py dans le meme cycle), ce
    # qui entamerait la marge de scan_shopify.yml. Ne PAS descendre plus
    # bas que la duree reelle mesuree, meme raison que scan_shopify.yml.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      boutiques:
        description: "Domaines à scanner, séparés par des espaces (vide = toutes les boutiques Shopify actives)"
        required: false
        default: ""
permissions:
  contents: write   # necessaire pour sauvegarder data/precommandes_generiques_shopify.json
concurrency:
  group: scan_precommandes_generique
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # Pas encore de mesure reelle en prod (premier lancement) -- 25 min
    # choisi par prudence (legerement sous les 30 min de scan_shopify.yml,
    # qui scanne le meme nombre de boutiques Shopify pour un travail
    # comparable). A ajuster une fois une marge reelle mesuree sur
    # plusieurs cycles (cf. CLAUDE.md : ne jamais resserrer/elargir un
    # timeout a l'aveugle).
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le radar précommandes générique (Shopify)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # mémoire du radar (cf. memoire_supabase.py, migration 25/08/2026) -- DISTINCT de POKEPRECOMS_SUPABASE_URL ci-dessous
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POKEPRECOMS_SUPABASE_URL: ${{ secrets.POKEPRECOMS_SUPABASE_URL }}
          POKEPRECOMS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POKEPRECOMS_SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"
          # Audit externe du 30/08/2026 : passer un input workflow_dispatch
          # directement dans le run: (${{ }}) l'injecte comme texte brut AVANT
          # que le shell ne le parse -- une valeur contenant des caracteres
          # shell speciaux casserait la commande, voire en injecterait une
          # autre. Passer par env: + "$VAR" est sur (le shell traite la
          # valeur comme une chaine, jamais comme de la syntaxe a reparser).
          BOUTIQUES: ${{ github.event.inputs.boutiques }}
        run: python scan_precommandes_generique.py $BOUTIQUES
