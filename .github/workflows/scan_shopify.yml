name: Scan Shopify
on:
  schedule:
    # Toutes les 30 minutes -- independant du cron principal (main.py,
    # toutes les 15 min). Les deux tournent en parallele sur le meme repo ;
    # cf. l'etape de sauvegarde ci-dessous pour la gestion des collisions Git.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      boutiques:
        description: "Domaines a scanner, separes par des espaces (vide = les 39 boutiques par defaut)"
        required: false
        default: ""
permissions:
  contents: write   # necessaire pour sauvegarder data/stock_boutiques_tcg.json
concurrency:
  group: scan_shopify   # groupe DEDIE, distinct de "pokedeals" (main.py) :
  cancel-in-progress: false  # les deux workflows tournent independamment l'un de l'autre
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # Mesure reelle en prod le 17/08/2026 (10 runs consecutifs, scan cartes +
    # radar precommandes) : 16.2-19.9 min, tous reussis -- mais marge tombee
    # a ~20% du budget (25 min), sous le surcout habituel de GitHub Actions
    # deja documente ailleurs dans ce projet (+19 a +38% vs mesures locales,
    # cf. diagnostic scan_lot_a dans SESSION_NOTES.md). Remonte a 30 min par
    # prudence (aucun timeout reel constate a ce jour, mais marge jugee trop
    # juste pour absorber un ralentissement ponctuel) -- a resserrer si la
    # duree mesuree reste stable sur plusieurs jours.
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le scan Shopify (39 boutiques par defaut)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel : active la verification photo (cf. verification_photo.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # optionnel : ajoute les cartes des watchlists SaaS (cf. watchlist_saas.py)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"   # sans ca, la sortie reste bufferisee et n'apparait dans le log qu'en fin de job -- inutile pour diagnostiquer un timeout
        run: python scan_boutique.py ${{ github.event.inputs.boutiques }}
      - name: Lancer le radar précommandes (30e Anniversaire / ME06 Règne Delta)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scan_precommandes.py shopify
      - name: Sauvegarder la mémoire du radar précommandes
        run: |
          git config user.name "pokedeals-bot"
          git config user.email "bot@pokedeals.local"
          cp -f data/precommandes_anniversaire_shopify.json /tmp/precommandes_anniversaire_shopify.json 2>/dev/null || true
          git stash || true
          git pull --rebase || git rebase --abort || true
          git stash pop || true
          git stash drop || true   # meme parade qu'a l'etape precedente -- purge un eventuel stash laisse par un pop en conflit
          cp -f /tmp/precommandes_anniversaire_shopify.json data/precommandes_anniversaire_shopify.json 2>/dev/null || true
          git add data/precommandes_anniversaire_shopify.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "maj mémoire radar précommandes shopify [skip ci]"
          git push || {
            echo "Push refusé, tentative de rattrapage..."
            cp -f data/precommandes_anniversaire_shopify.json /tmp/precommandes_anniversaire_shopify.json 2>/dev/null || true
            git pull --rebase || git rebase --abort || true
            cp -f /tmp/precommandes_anniversaire_shopify.json data/precommandes_anniversaire_shopify.json 2>/dev/null || true
            git add data/precommandes_anniversaire_shopify.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "maj mémoire radar précommandes shopify [skip ci]"
            git push
          }
