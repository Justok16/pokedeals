name: Scan Shopify
on:
  schedule:
    # Resserre a 25 min le 28/08/2026 (demande de Justok, grosse sortie
    # Pokemon a venir, ne pas rater les bonnes affaires) -- mesure reelle
    # sur ~10 cycles consecutifs ce jour-la : 18.4-23.0 min (marge encore
    # confortable, >=8% a 25 min). Ne PAS descendre plus bas sans nouvelle
    # mesure : en dessous de la duree reelle, les triggers cron s'empilent
    # plus vite qu'ils ne se vident (concurrency cancel-in-progress=false),
    # ce qui degraderait la cadence au lieu de l'ameliorer.
    - cron: "*/25 * * * *"
  workflow_dispatch:
    inputs:
      boutiques:
        description: "Domaines a scanner, separes par des espaces (vide = les 39 boutiques par defaut)"
        required: false
        default: ""
permissions:
  contents: write   # necessaire pour sauvegarder data/stock_boutiques_tcg.json
concurrency:
  group: scan_shopify   # groupe DEDIE, distinct de "pokedeals" (main.py) :
  cancel-in-progress: false  # les deux workflows tournent independamment l'un de l'autre
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    # Mesure reelle en prod le 17/08/2026 (10 runs consecutifs, scan cartes +
    # radar precommandes) : 16.2-19.9 min, tous reussis -- mais marge tombee
    # a ~20% du budget (25 min), sous le surcout habituel de GitHub Actions
    # deja documente ailleurs dans ce projet (+19 a +38% vs mesures locales,
    # cf. diagnostic scan_lot_a dans SESSION_NOTES.md). Remonte a 30 min par
    # prudence (aucun timeout reel constate a ce jour, mais marge jugee trop
    # juste pour absorber un ralentissement ponctuel) -- a resserrer si la
    # duree mesuree reste stable sur plusieurs jours.
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer le scan Shopify (39 boutiques par defaut)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel : active la verification photo (cf. verification_photo.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # optionnel : ajoute les cartes des watchlists SaaS (cf. watchlist_saas.py)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}   # notifications push des utilisateurs SaaS (cf. notifications_saas.py) -- manquait ici (28/08/2026), notifier_deals_boutique_saas() n'a donc jamais notifie personne depuis ce workflow
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}   # notifications email des utilisateurs SaaS (cf. notifications_saas.py)
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PYTHONUNBUFFERED: "1"   # sans ca, la sortie reste bufferisee et n'apparait dans le log qu'en fin de job -- inutile pour diagnostiquer un timeout
          # Audit externe du 30/08/2026 : passer par env: + "$VAR" plutot que
          # d'injecter ${{ }} directement dans run: (injection shell possible).
          BOUTIQUES: ${{ github.event.inputs.boutiques }}
        run: python scan_boutique.py $BOUTIQUES
      - name: Lancer le radar précommandes (30e Anniversaire / ME06 Règne Delta)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # mémoire du radar (cf. memoire_supabase.py, migration 25/08/2026)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scan_precommandes.py shopify
