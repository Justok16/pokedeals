# Portefeuille de concepts a tester — notes de 0 a 5 par critere.
#
# REGLE : une note n'est PAS une verite, c'est une hypothese datee et
# justifiee. Chaque note discutable porte un commentaire. Les tests reels
# (cf. 03-plan-execution.md) doivent faire bouger ces notes.
#
# Derniere revision : 2026-09-21
# Prochaine revision obligatoire : apres le premier cycle de tests (J+30)

concepts:

  - id: A1
    nom: "PokeDeals Media FR"
    cluster: "A — levier sur l'actif existant"
    resume: >-
      Compte faceless (Shorts/TikTok/Reels) alimente par les donnees reelles du
      scraper : la bonne affaire du jour, l'ecart de prix entre boutiques, la
      carte qui a le plus monte cette semaine. Le contenu n'est pas "genere par
      IA a partir de rien" : il est genere a partir d'une base de donnees
      proprietaire que personne d'autre n'a.
    notes:
      potentiel_audience: 4      # ~4 M collectionneurs FR (SRTCG), audience TCG tres active sur short-form
      croissance_demande: 4      # marche FR des jeux de cartes +12%/an, Pokemon +18% (2024)
      valeur_commerciale: 3      # panier eleve mais CPM FR divertissement moyen
      concurrence_faible: 2      # beaucoup de comptes Pokemon FR, peu avec de la DONNEE
      facilite_production: 4     # script auto depuis data/cotes.json
      cout_faible: 5
      affiliation: 3             # eBay ~1-4%, boutiques FR variables, Amazon jeux ~1-3%
      produit_numerique: 3
      revenu_recurrent: 3        # via bascule vers le SaaS existant
      international: 3           # marche EN possible mais concurrence US massive
      durabilite: 4
      independance_plateforme: 3 # audience louee, mais redirigeable vers newsletter/SaaS
      risque_juridique_faible: 3 # images de cartes = droits Nintendo/TPC, usage editorial a encadrer
      automatisation: 4
      levier_actif_existant: 5
      revente_actif: 3

