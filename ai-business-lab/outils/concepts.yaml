# Portefeuille de concepts a tester — notes de 0 a 5 par critere.
#
# REGLE : une note n'est PAS une verite, c'est une hypothese datee et
# justifiee. Chaque note discutable porte un commentaire. Les tests reels
# (cf. 03-plan-execution.md) doivent faire bouger ces notes.
#
# Contexte : demarrage a zero, 0 EUR, faceless, francophone, 4 h/jour.
# Derniere revision : 2026-09-21
# Prochaine revision obligatoire : apres le premier cycle de tests (J+30)

concepts:

  - id: A1
    nom: "Facture electronique 2026-2027 (media + annuaire + affiliation)"
    cluster: "A — B2B francophone a forte valeur"
    resume: >-
      Media de niche sur l'obligation de facturation electronique : contenu
      pedagogique, newsletter d'echeances, annuaire comparatif des plateformes
      agreees et logiciels de facturation, monetise par affiliation SaaS
      recurrente. La reforme est entree en vigueur le 01/09/2026 (reception
      obligatoire pour toutes les entreprises assujetties a la TVA) et
      l'obligation d'emission frappe les PME/TPE/micro au 01/09/2027 : des
      millions d'entreprises francaises doivent s'equiper dans les 12 mois.
    notes:
      potentiel_audience: 4      # toutes les entreprises FR assujetties a la TVA
      croissance_demande: 5      # obligation legale datee = demande contrainte, pas optionnelle
      valeur_commerciale: 5      # B2B logiciel : RPM/CPM les plus eleves, abonnements a commissionner
      concurrence_faible: 3      # les editeurs et cabinets comptables communiquent, mais peu de media independant
      facilite_production: 3     # sujet aride : exige rigueur et verification, pas de creativite
      cout_faible: 5
      affiliation: 5             # logiciels de facturation/compta en abonnement = commissions recurrentes
      produit_numerique: 4       # checklist de conformite, modeles, mini-formation
      revenu_recurrent: 5
      international: 2           # reforme franco-francaise ; equivalents UE differents
      durabilite: 2              # FENETRE : l'urgence retombe apres 2027 -> reconversion prevue des le depart
      independance_plateforme: 5 # SEO + email, pas de dependance a un algorithme social
      risque_juridique_faible: 2 # information reglementaire : une erreur a des consequences reelles
      automatisation: 3          # veille et redaction assistees, MAIS verification humaine obligatoire
      avantage_defendable: 4     # exactitude + exhaustivite de l'annuaire + anteriorite = difficile a copier vite
      vitesse_validation: 4      # intention de recherche mesurable en quelques semaines
      revente_actif: 4

  - id: A2
    nom: "IA appliquee a UN metier precis (pas 'les outils IA' en general)"
    cluster: "A — B2B francophone a forte valeur"
    resume: >-
      Media + newsletter sur l'usage concret de l'IA dans un seul metier
      (ex. comptables, agents immobiliers, artisans, RH). L'inverse du
      "top 10 des outils IA" : des cas d'usage verifies dans un contexte
      professionnel precis.
    notes:
      potentiel_audience: 3      # un metier = audience etroite mais dense
      croissance_demande: 5
      valeur_commerciale: 5      # B2B SaaS : RPM FR 6-12 EUR, affiliation recurrente 20-60%
      concurrence_faible: 3      # le generaliste IA est sature, le vertical metier beaucoup moins
      facilite_production: 3
      cout_faible: 5
      affiliation: 5             # ex. systeme.io 60% recurrent a vie ; SaaS verticaux
      produit_numerique: 4
      revenu_recurrent: 5
      international: 3
      durabilite: 3              # les outils tournent vite : c'est le METIER qui dure, pas l'outil
      independance_plateforme: 4
      risque_juridique_faible: 3
      automatisation: 3          # tester reellement les outils n'est pas automatisable
      avantage_defendable: 4     # la specialisation metier est la barriere ; le generaliste n'en a aucune
      vitesse_validation: 4
      revente_actif: 4

