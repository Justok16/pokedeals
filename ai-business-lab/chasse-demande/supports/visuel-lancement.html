.logo{position:absolute;left:70px;bottom:46px;height:92px;width:auto}
.note{position:absolute;right:70px;bottom:60px;font-size:16px;color:#a8a093}
.ph{position:absolute;right:80px;top:410px;width:400px;height:800px;border-radius:52px;border:12px solid #181613;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.06)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(180deg,rgba(18,16,13,0),#0f0e0c 85%)}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet"><style id="charte-dig16">
