<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;background:#0b1020;color:#fff;font-family:Inter,sans-serif;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 420px at 88% 58%,rgba(245,158,107,.28),transparent 70%),radial-gradient(600px 500px at 0% 100%,rgba(192,86,224,.22),transparent 70%)}
.titre{position:absolute;left:70px;right:70px;top:78px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:74px;line-height:1.04;letter-spacing:-.01em}
h1 em{display:block;font-style:italic;color:#f59e6b;margin-top:10px}
.gauche{position:absolute;left:70px;top:560px;width:450px}
.gauche p{font-size:31px;line-height:1.35;color:#dfe4f2;text-wrap:balance}
.trait{width:64px;height:3px;background:linear-gradient(90deg,#f59e6b,#c056e0);margin:0 0 30px}
.puces{margin-top:34px;display:grid;gap:14px}
.puce{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600}
.puce i{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(245,158,107,.18);border:2px solid #f59e6b;display:grid;place-items:center;font-style:normal;color:#f59e6b;font-size:18px;line-height:1}
.cta{position:absolute;left:70px;bottom:190px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#f59e6b,#c056e0);padding:0 34px;height:80px;border-radius:40px;font-size:26px;font-weight:700;line-height:1}
.logo{position:absolute;left:70px;bottom:52px;font-family:Fraunces,serif;font-weight:700;font-size:56px;line-height:1}
.note{position:absolute;right:70px;bottom:60px;font-size:16px;color:#7c86a3}
.ph{position:absolute;right:80px;top:410px;width:400px;height:800px;border-radius:52px;border:12px solid #1f2937;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.06)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(180deg,rgba(18,16,13,0),#12100d 85%)}
</style></head><body>
<div class="titre"><h1>Vos clients vous cherchent sur leur téléphone. <em>Ils vous trouvent ?</em></h1></div>
<div class="gauche"><div class="trait"></div><p>Votre page d'accueil refaite <b>gratuitement</b>, avant de décider.</p>
<div class="puces"><div class="puce"><i>✓</i>Dès 29 €/mois</div><div class="puce"><i>✓</i>0 € de création</div><div class="puce"><i>✓</i>Site à votre nom</div></div></div>
<div class="ph"><img src="lancement-demo.png" alt=""></div>
<div class="cta">Demandez votre démo gratuite</div>
<div class="logo">DIG16</div><div class="note">Exemple de site fictif.</div>
</body></html>
