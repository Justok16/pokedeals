# DigCost — site statique, rendu par GitHub Pages sans etape de build.
title: DigCost
description: >-
  Le cout reel des outils e-commerce, calcule et source. Pas de methode pour
  devenir riche, pas de capture d'ecran de chiffre d'affaires.
lang: fr

# baseurl : le prefixe d'URL sous lequel le site est servi.
#   - servi a la racine d'un domaine (digcost.fr) ou depot <compte>.github.io -> ""
#   - servi sous github.io/<depot>/                                          -> "/<depot>"
# Tous les liens internes passent par le filtre relative_url : changer cette
# seule ligne suffit, aucun lien n'est a reecrire.
baseurl: ""
url: ""

# Kramdown + le theme minimal : aucune dependance a installer.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md

defaults:
  - scope: { path: "" }
    values: { layout: "default" }
