    langue: fr
    marge_achat: 0.25  # ULTRA STAR (réactivité maximale)
  - nom: "Dracaufeu ex 201/165"
    langue: fr
    marge_achat: 0.25  # ULTRA STAR (réactivité maximale)
  - nom: "Tortank ex 200/165"
    langue: fr
    marge_achat: 0.25  # ULTRA STAR (réactivité maximale)
  - nom: "Florizarre ex 198/165"
    langue: fr
