  - nom: "Pikachu 170/151"              # exclusive "Journey" (Pikachu volant)
    langue: cn
  - nom: "Pikachu 171/151"              # exclusive "Hope" (avec Psyduck) — la plus chère (~600€+)
    langue: cn
  - nom: "Pikachu 172/151"              # exclusive "Surprise" (avec Ectoplasma)
    langue: cn
  - nom: "Pikachu 173/151"              # exclusive "Gathering" (clairière de Pikachu)
    langue: cn


# --- Calcul automatique de la cote ---
cote:
  # V12 : la cote est le 1er quartile des annonces pertinentes (le prix "qui part
  # vite"), et non plus la médiane gonflée par les annonces invendues.
  coefficient_marche: 1.0
  # V15 : le filtre par numéro réduit le nombre d'annonces retenues.
  # On passe de 6 à 4 annonces minimum — elles sont maintenant toutes fiables.
  minimum_annonces: 4
  # 💡 Pour une carte clé, tu peux imposer TA cote (relevée sur Cardmarket) :
  #    ajoute "cote: 250" sous la carte dans la watchlist. Elle sera prioritaire.

# --- Mon stock (alertes de REVENTE) ---
mes_achats: []

# --- Rapport quotidien sur Telegram ---
rapport:
  actif: true
  heure: 21        # heure de Paris (le scan qui tourne entre 21h00 et 21h59 l'envoie)

# --- Détection d'anomalies de cote ---
anomalies:
  seuil_chute: 0.30    # alerte ⚠️ si une cote perd 30% ou plus
  seuil_hausse: 0.50   # alerte 🚀 si une cote gagne 50% ou plus

# --- Notifications ---
notifications:
  telegram: true    # canal principal (instantané)
  email: false      # en plus par email (mets "false" si Telegram suffit)

telegram:
  chat_id: "1245330032"   # V15 : vérifié via getUpdates le 13/07/2026
  # Le token du bot (donné par @BotFather) est stocké dans les
  # "Secrets" GitHub (jamais dans ce fichier) : TELEGRAM_BOT_TOKEN

email:
  destinataire: "justokseize@gmail.com"
  expediteur: "justokseize@gmail.com"
  # Le mot de passe d'application Gmail est stocké dans les
  # "Secrets" GitHub (jamais dans ce fichier) : GMAIL_APP_PASSWORD


# --- Leboncoin via alertes email (contourne le blocage anti-robot) ---
# 1. Sur leboncoin.fr : fais ta recherche (ex. "dracaufeu ex 199/165"),
#    clique "Créer une alerte" (email, fréquence : temps réel), connecté
#    avec l'adresse Gmail ci-dessus.
# 2. Le secret GitHub GMAIL_APP_PASSWORD doit exister (mot de passe
#    d'application : myaccount.google.com/apppasswords).
# 3. Le bot lit les emails NON LUS de Leboncoin à chaque scan et les
#    traite comme des annonces normales (filtre + cote + alerte Telegram).
leboncoin_alertes_email:
  actif: true
  imap_hote: imap.gmail.com
  boite: INBOX

# --- Plateformes actives ---
plateformes:
  ebay: true
  vinted: true
  leboncoin: false  # scraping direct bloqué par DataDome -> remplacé par les alertes email ci-dessus
