  # ----- Cartes ÉTRANGÈRES (V16) -----
  # Chaque langue = une entrée séparée (cotes calculées à part, sinon les
  # versions étrangères moins chères fausseraient les cotes françaises).
  # "alias" = nom français accepté dans les titres d'annonces.
  # ⚠️ EN/KR : numérotation identique à la FR/JP pour ces sets (à vérifier
  # à la première alerte reçue).
  - nom: "Charizard ex 199/165"         # Dracaufeu ex SIR, version ANGLAISE
    langue: en
    alias: "Dracaufeu"
  - nom: "Blastoise ex 200/165"         # Tortank ex SIR, version ANGLAISE
    langue: en
    alias: "Tortank"
