# ============================================================
# PokéDeals — Configuration (V15)
# C'est le SEUL fichier que tu auras besoin de modifier.
# V15 : chaque carte porte son NUMÉRO de collection exact.
# Les noms sont raccourcis (sans nom de set) : le numéro suffit
# à identifier la carte, et les requêtes eBay sont plus efficaces.
# ============================================================

# --- Règles d'achat / revente (GLOBALES) ---
regles:
  frais_port_max: 6.0        # € — frais de port maximum acceptés
  marge_achat: 0.30          # achat par défaut à au moins 30% NET sous la cote
  marge_revente: 0.10        # marge utilisée pour le prix de revente conseillé
  multiplicateur_revente: 2.0  # alerte VENTE quand la cote atteint 2x ton prix d'achat
  frais_revente_estimes: 0.13  # ~13% de frais si revente sur eBay (utilisé pour le calcul "net")
  cote_min: 15.0             # ignorer les cartes dont la cote est sous 15€ (micro-deals sans intérêt)
  profit_min: 10.0           # n'alerter que si le profit net estimé atteint au moins 10€
  prix_max: 0                # 0 = pas de budget maximum par carte
  # V16 : eBay international — annonces situées à l'étranger mais
  # LIVRABLES en France, avec un port maximum spécifique
  ebay_international: true
  frais_port_max_international: 10.0

# --- États acceptés (mots-clés détectés dans les annonces) ---
etats_acceptes:
  - "neuf"
  - "neuve"
  - "near mint"
  - "nm"
  - "mint"
  - "comme neuf"
  - "jamais joué"
  - "pack fresh"
etats_refuses:
  - "played"
  - "poor"
  - "abim"        # abimé / abîmée
  - "pliée"
  - "plié"
  - "damaged"
  - "psa"         # on ne veut pas de cartes gradées
  - "pca"
  - "bgs"
  - "cgc"
  - "gradée"
  - "gradee"
  - "graded"

# --- Cartes surveillées ---
