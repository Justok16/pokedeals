    langue: fr
    marge_achat: 0.25  # ULTRA STAR (réactivité maximale)
  - nom: "Alakazam ex 188/165"
    langue: fr
  - nom: "Mew ex 193/165"
    langue: fr
  - nom: "Mew ex 205/165"
    langue: fr
    marge_achat: 0.25  # ULTRA STAR (réactivité maximale)
  - nom: "Salamèche 168/165"
    langue: fr
  - nom: "Bulbizarre 166/165"
