# --- Calcul automatique de la cote ---
cote:
  # La cote est calculée à partir de la médiane des annonces eBay actives
  # (achat immédiat), corrigée par ce coefficient car les prix affichés
  # sont en général un peu au-dessus des prix de vente réels.
  coefficient_marche: 0.92
  minimum_annonces: 4   # nombre minimum d'annonces pour calculer une cote fiable

# --- Mon stock (alertes de REVENTE) ---
# Déclare ici les cartes que tu as ACHETÉES avec leur prix payé (port inclus).
# À chaque scan, le bot vérifie leur cote actuelle et t'alerte sur Telegram
# quand la cote atteint 2x ton prix d'achat (multiplicateur_revente).
# L'alerte est renvoyée une fois par semaine tant que la condition tient.
#
# Exemple (enlève les "# " pour activer) :
# mes_achats:
#   - nom: "Méga-Gardevoir ex 187/132"
#     langue: fr
#     prix_achat: 120
#   - nom: "Mew ex 205/165"
#     langue: fr
#     prix_achat: 35
#     cote: 90          # optionnel : cote manuelle si peu d'annonces eBay
mes_achats: []

# --- Récapitulatif quotidien sur Telegram ---
rapport:
  actif: true
  heure: 21        # heure de Paris (le scan qui tourne entre 21h00 et 21h59 l'envoie)

# --- Détection d'anomalies de cote ---
anomalies:
  seuil_chute: 0.30    # alerte ⚠️ si une cote perd 30% ou plus
  seuil_hausse: 0.50   # alerte 🚀 si une cote gagne 50% ou plus

# --- Notifications ---
notifications:
  telegram: true    # canal principal (instantané)
  email: false      # en plus par email (mets "false" si Telegram suffit)

telegram:
  chat_id: "1245330032"
  # Le token du bot (donné par @BotFather) est stocké dans les
  # "Secrets" GitHub (jamais dans ce fichier) : TELEGRAM_BOT_TOKEN

email:
  destinataire: "justokseize@gmail.com"
  expediteur: "justokseize@gmail.com"
  # Le mot de passe d'application Gmail est stocké dans les
  # "Secrets" GitHub (jamais dans ce fichier) : GMAIL_APP_PASSWORD

# --- Plateformes actives ---
plateformes:
  ebay: true
  vinted: true
  leboncoin: true   # best effort : Leboncoin bloque parfois les robots
