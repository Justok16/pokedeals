  # toutes ces versions (marché FR structurellement vide, numéros
  # différents selon les pays). Elles polluaient les logs sans jamais
  # produire de cote. Les versions JAPONAISES (déjà présentes plus haut :
  # Charizard sv2a, Darkrai/Zeraora Abyss Eye...) fonctionnent, elles.
  # Pour surveiller une carte étrangère précise à l'avenir, le plus fiable
  # sera de lui donner une cote manuelle (cote: XX) plutôt qu'un calcul.


# --- V22 : cotes CARDTRADER (marché européen, prix réels par langue) ---
# Cardtrader expose les VRAIES annonces filtrables par langue (fr/jp/kr),
# en euros, via une API gratuite (token perso dans les secrets GitHub).
# C'est ce qui manquait à TCGdex (qui mélangeait les langues) et à
# l'API Cardmarket (fermée + usage quotidien interdit).
#
# mode "observation" : le prix Cardtrader est AFFICHÉ dans les logs à
#   côté de la cote eBay, sans rien changer — phase de vérification.
# mode "actif" : le prix Cardtrader REMPLACE la cote eBay (les cotes
#   manuelles "cote:" restent prioritaires ; en cas d'échec API, on
#   retombe automatiquement sur la cote eBay).
#
# nb_prix_bas : la cote = moyenne des N annonces les MOINS CHÈRES.
# min_annonces : en dessous de N annonces cohérentes, pas de cote
#   Cardtrader (un marché d'1-2 annonces n'est pas fiable).
# mode "secours" (V24) : la cote eBay reste PRIORITAIRE ; Cardtrader ne
#   sert que quand eBay ne trouve rien (cartes JP/KR sans annonces en
#   France), avec une décote de prudence et un plafond. Les alertes
#   concernées sont marquées "cote Cardtrader" sur Telegram.
api_cotes:
  actif: true
  mode: "plus_bas"
  nb_prix_bas: 5
  min_annonces: 3
  # V47 : seuil ABAISSÉ spécifiquement pour les cartes coréennes (langue:
  # kr) — la SEULE langue sans aucun repli TCGdex possible (Cardmarket ne
  # cote pas le coréen). Sans Cardtrader, ces cartes n'ont aucune
  # vérification croisée du tout. Un marché coréen de 1 annonce reste
  # moins fiable qu'un marché FR/JP de 3, mais mieux qu'aucune
  # vérification — les GARDE-FOU 2 (prix aberrants écartés) et 4 (écart
  # ×5 vs eBay) restent actifs et limitent le risque d'une annonce isolée
  # erronée.
  min_annonces_kr: 1
  # V24 : quand le set d'une carte n'est pas déductible de son nom
  # (promos, numéros nus : « Morpeko ex 117 », « Poissirene 087 »), on
  # cherche dans les N expansions les plus RÉCENTES. La watchlist ne
  # suivant que des séries récentes, 30 suffit largement. Les catalogues
  # sont mis en cache, donc le surcoût reste limité.
  # Mettre 0 pour désactiver ce repli.
  sets_recents: 30
  # V24 : une même carte ne peut pas valoir N fois plus dans une langue
  # que dans une autre. Au-delà de ce facteur, le prix est écarté.
  # Protège les cartes SANS cote eBay (cf. Mew ex 208 sv2a : 51€ en JP
  # mais 5020€ en KR, alors qu'il s'achète à moins de 30€ sur Cardmarket).
  facteur_langues: 5
  # V24 : en mode secours, cote = prix Cardtrader x ce coefficient
  # (0.90 = -10% de prudence, Cardtrader étant un marché pro).
  decote_secours: 0.90
  # V24 : en mode secours, un prix Cardtrader au-dessus de ce plafond est
  # ignoré (protège des aberrations quand aucune cote eBay ne recoupe).
  cote_secours_max: 1500

# --- V22.8 : garde-fou anti « prix d'appel » ---
# Une annonce dont le prix total est inférieur à ce pourcentage de la cote
# est REJETÉE (pas alertée) : à ce niveau, ce n'est plus une affaire mais
# une enchère déguisée, un article factice ou une erreur.
# Ex. 0.15 = on ignore tout ce qui est sous 15% de la cote
#     (une carte cotée 365€ affichée 5€ ne déclenche plus d'alerte).
prix_plancher_ratio: 0.15

# --- Calcul automatique de la cote ---
cote:
  # V23 : MÉTHODE de calcul de la cote eBay.
  #   "mediane"    = milieu des prix DEMANDÉS (historique — surévalue le
  #                  marché réel, car eBay affiche des espoirs de vendeurs)
  #   "bas_marche" = moyenne des `nb_prix_bas` annonces les moins chères
  #                  (même logique que Cardtrader, plus proche du prix
  #                  auquel une carte part réellement)
  # Vérifié à la main contre Cardmarket sur 3 cartes : la médiane eBay
  # dépasse la tendance Cardmarket d'un facteur 1,8 à 2,5.
  # Les DEUX valeurs sont affichées dans les logs quelle que soit la
  # méthode retenue -> on peut comparer avant de basculer.
  # Basculé en "bas_marche" le 24/07/2026 après vérification manuelle
  # contre Cardmarket sur 5 cartes : le bas-marché l'emporte à chaque
  # fois (Tortank 169,20€ vs Cardmarket 173,65€ ; Bulbizarre 95,58€ vs
  # 66,74€ ; Evoli 174 37,56€ vs 19,35€...). La médiane surévaluait de
  # 1,3x à 2,6x, le bas-marché de 1,0x à 1,9x.
  methode: "bas_marche"
  # V43 : passage de 5 à 3 annonces. Vérifié le 30/07/2026 sur 3 cartes où
  # le vrai prix Cardmarket était connu : réduire le panier de 5 à 3
  # améliore nettement Evoli 188/167 (127,78€ -> 79,63€, contre un vrai
  # prix de 80€), sans rien dégrader sur Bulbizarre ni Salamèche (ces
  # deux-là n'ont AUCUNE annonce eBay proche du vrai prix, donc aucun
  # réglage de panier ne peut les corriger — seule une cote manuelle ou
  # Cardtrader peut aider sur ces cas-là).
  nb_prix_bas: 3
  coefficient_marche: 1.0
  # V20 : passage de 4 à 6 annonces minimum. Avec seulement 4 annonces, sur
  # un marché mince (cartes JP/KR de niche), 2 annonces surcotées suffisent à
  # gonfler la médiane et créer de fausses alertes (cf. Charmander 168/165
  # sv2a affichée à 58€ alors que le marché réel est à ~27€). À 6 annonces,
  # la médiane est nettement plus robuste. Les cartes à marché trop mince
  # n'auront simplement pas de cote (= pas de fausse alerte).
  minimum_annonces: 6
  # 💡 Pour une carte clé, tu peux imposer TA cote (relevée sur Cardmarket) :
  #    ajoute "cote: 250" sous la carte dans la watchlist. Elle sera prioritaire.
  #    Ajoute aussi cote_date: "2026-08-07" (date du jour où tu l'as
  #    relevée) : passé 30 jours, le bot t'enverra un rappel Telegram pour la
  #    revérifier (sinon elle peut devenir fausse en silence pendant des mois).
  #    Sans cote_date, pas de rappel possible.

