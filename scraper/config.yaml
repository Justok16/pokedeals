  # deja mappe, mais jamais consulte faute de denom) ni le filtre eBay/
  # boutiques (numero "098" nu, risque de confondre avec une AUTRE carte
  # numerotee 098 dans un set different) ne pouvaient fonctionner
  # correctement -- explique la cote eBay erronee a ~0,72e. Corrige en
  # ajoutant le denominateur ; cote manuelle retiree pour laisser
  # l'automatisation (desormais fonctionnelle) reprendre la main.
  - nom: "Tiplouf 098/094"               # Flammes Fantasmagoriques (PFL) FR
    langue: fr
    # V52 (18/08/2026) : audit maximal -- cote_min (15€, regles globales)
    # bloquait TOUTE alerte pour cette carte, sa cote reelle (13,89-19,3€,
    # cf. data/cotes.json) passant regulierement sous le seuil. Meme
    # mecanisme que Carapuce/Plumeline (prix_max_fixe bypass cote_min),
    # seuil choisi par Justok.
    prix_max_fixe: 14
