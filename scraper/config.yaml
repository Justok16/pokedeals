  # TCGdex /ja/sets), SANS AUCUN RAPPORT avec "ME02 Phantasmal Flames"
  # malgre la similitude du code -- CT_SETS_JP["m2"] corrige en
  # consequence dans main.py. Deuxieme bug trouve au passage : l'identifiant
  # TCGdex ("m2-85") necessitait un padding a 3 chiffres ("m2-085") jamais
  # applique pour les cartes JP (seul le cas promo SWSH l'avait) -- corrige
  # dans deduire_api_id(). Avec les deux fix, le repli TCGdex retrouve
  # automatiquement 6,14€ (quasi identique a la capture Cardmarket de
  # Justok, 5,70€) : cote manuelle retiree, automatisation confirmee EN
  # DIRECT (pas seulement deduite) avant de la retirer.
  - nom: "Piplup 085 m2"                # Inferno X (JP) = Tiplouf
    langue: jp
    alias: "Tiplouf"
    # V52 (18/08/2026) : meme raison que Tiplouf FR ci-dessus -- cote reelle
